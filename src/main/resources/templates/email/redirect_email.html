<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email</title>
</head>
<body style="margin:0; padding:0; font-family: Helvetica, Arial, sans-serif; background-color:#f4f4f4;">
<table width="100%" height="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0;">
    <tr>
        <td align="center">
            <table width="600" style="background-color:#ffffff; border:1px solid #dddddd; border-radius:10px; padding: 40px;">
                <tr>
                    <td align="center" style="font-size:24px; font-weight:bold; color:#333333; padding-bottom:20px;">
                        {{title}}
                    </td>
                </tr>
                <tr>
                    <td align="center" style="font-size:16px; color:#666666; padding-bottom:30px;">
                        {{message}}
                    </td>
                </tr>
                <tr>
                    <td align="center">
                        <a href="{{redirectUrl}}" style="
                                background-color:#4CAF50;
                                color:white;
                                padding:15px 25px;
                                text-decoration:none;
                                font-size:16px;
                                border-radius:5px;
                                display:inline-block;">
                            {{redirectMessage}}
                        </a>
                    </td>
                </tr>
                <tr>
                    <a style="font-size: 12px; font-weight: bold; color: #000000; padding-top: 20px">Studentious | SevenTailed Team iTec</a>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
